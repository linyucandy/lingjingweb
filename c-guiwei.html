<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>归位 · 收纳屋｜M2 垂直切片（LJ-T-003）</title>
<style>
  :root{
    --bg:#f3eadf; --card:#fffaf3; --ink:#3b322b; --muted:#8c7f73;
    --line:#e6d9c8; --accent:#c98b6b; --accent2:#9bbf9a; --gold:#d9a441;
    --shadow:0 8px 24px rgba(92,66,44,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff8ec 0%, rgba(255,248,236,0) 60%),
      linear-gradient(180deg,#f6eee3 0%, #efe3d4 100%);
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:540px; min-height:100dvh; display:flex; flex-direction:column; gap:8px; padding:10px 10px 18px;}
  header{display:flex; flex-direction:column; gap:6px;}
  .brandRow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .brand{font-size:18px; font-weight:800; letter-spacing:2px;}
  .brand span{font-size:11px; font-weight:500; color:var(--muted); letter-spacing:1px; margin-left:6px;}
  .roomTag{font-size:11px; color:var(--muted);}
  .hud{display:flex; gap:6px;}
  .hudChip{flex:1; background:rgba(255,250,243,.8); border:1px solid var(--line); border-radius:10px; padding:5px 8px; font-size:11px; color:var(--muted); display:flex; justify-content:space-between; align-items:center;}
  .hudChip b{font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums;}
  .cleanTrack{height:6px; background:#e7d9c6; border-radius:99px; overflow:hidden;}
  .cleanTrack i{display:block; height:100%; width:0%; background:linear-gradient(90deg,#b6d3a8,#7fae7a); transition:width .35s;}
  #roomWrap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px; box-shadow:var(--shadow);}
  #room{
    position:relative; height:clamp(310px,46vh,420px); border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,#f1e4d2 0%, #efe0cb 61%, #d9b892 61%, #cfa87f 100%);
    isolation:isolate;
  }
  #room::before{
    content:""; position:absolute; inset:0 0 39% 0;
    background-image:radial-gradient(rgba(160,125,90,.10) 1px, transparent 1px);
    background-size:18px 18px; opacity:.8;
  }
  /* M2：3 个主题的房间底调 */
  #room[data-theme="t2"]{background:linear-gradient(180deg,#fbe9e6 0%, #f7dcd5 61%, #e6bfa8 61%, #dcb094 100%);}
  #room[data-theme="t2"]::before{background-image:radial-gradient(rgba(200,140,120,.12) 1px, transparent 1px);}
  #room[data-theme="t3"]{background:linear-gradient(180deg,#eae6da 0%, #ded9c9 61%, #bbae93 61%, #a89a80 100%);}
  #room[data-theme="t3"]::before{background-image:radial-gradient(rgba(115,105,85,.14) 1px, transparent 1px);}
  .window{
    position:absolute; left:7%; top:9%; width:24%; height:31%;
    background:linear-gradient(180deg,#bcd8ea,#e8f2f8); border:6px solid #fffaf3; border-radius:9px;
    box-shadow:0 6px 16px rgba(70,90,110,.12), inset 0 0 20px rgba(255,255,255,.7);
  }
  .window::after{content:""; position:absolute; inset:0; background:
    linear-gradient(90deg,transparent 47%, rgba(255,255,255,.85) 47% 53%, transparent 53%),
    linear-gradient(180deg,transparent 47%, rgba(255,255,255,.85) 47% 53%, transparent 53%);}
  .shelf{position:absolute; right:7%; top:16%; width:30%; height:7px; background:#c8a983; border-radius:4px; box-shadow:0 4px 0 rgba(120,90,60,.15);}
  .shelf::after{content:"🪴  🖼️"; position:absolute; right:0; bottom:7px; font-size:18px; opacity:.55; letter-spacing:6px;}
  .rug{position:absolute; left:18%; bottom:5%; width:60%; height:18%; background:radial-gradient(ellipse at center,#ecd3b4 0%, #e6c9a8 60%, rgba(230,201,168,0) 72%); opacity:.9;}
  #roomLabel{
    position:absolute; left:10px; top:10px; z-index:900; font-size:11px; color:#6f5f50;
    background:rgba(255,250,243,.82); border:1px solid var(--line); padding:4px 9px; border-radius:99px; backdrop-filter:blur(4px);
  }
  #storyBar{
    margin-top:8px; display:flex; gap:8px; align-items:flex-start; background:#fdf6ec; border:1px dashed #e2cfb4;
    border-radius:10px; padding:8px 10px; font-size:12px; line-height:1.55; color:#6b5b4c; min-height:44px;
  }
  #storyBar .ico{flex:0 0 auto; width:3px; align-self:stretch; margin:2px 0; background:var(--accent); border-radius:3px;}
  #items{position:absolute; inset:0; z-index:20;}
  .item{
    position:absolute; width:clamp(38px,9.6vw,48px); aspect-ratio:1; margin:0; padding:0; border:none;
    transform:translate(-50%,-50%) rotate(var(--r,0deg));
    border-radius:11px; background:linear-gradient(180deg,#fffdf9,#f4e8d8);
    box-shadow:0 3px 0 rgba(120,90,60,.16), 0 6px 12px rgba(90,60,35,.12);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; line-height:1; cursor:pointer;
    transition:transform .16s, opacity .2s, filter .2s; user-select:none; touch-action:manipulation;
  }
  .item .ie{font-size:clamp(18px,4.6vw,23px); line-height:1.08;}
  .item .ie svg{width:clamp(21px,5.2vw,26px); height:clamp(21px,5.2vw,26px); display:block; fill:none; stroke:#6b5b4c; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;}
  .item.blocked .ie svg{stroke:#8b7a68;}
  .item .il{font-size:8px; line-height:1.15; color:#8b7a68; letter-spacing:.4px;}
  .item:hover{filter:brightness(1.04);}
  .item.blocked{filter:brightness(.82) saturate(.82); box-shadow:0 2px 0 rgba(120,90,60,.10); cursor:not-allowed;}
  .item.taken{opacity:0; transform:translate(-50%,-50%) scale(.25) rotate(var(--r,0deg)); pointer-events:none;}
  .item.shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg));}25%{transform:translate(-54%,-50%) rotate(calc(var(--r,0deg) - 4deg));}75%{transform:translate(-46%,-50%) rotate(calc(var(--r,0deg) + 4deg));}}
  .spark{position:absolute; width:6px; height:6px; border-radius:99px; z-index:60; pointer-events:none; animation:spark .6s ease-out forwards;}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0;}}
  #bubble{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:800;
    background:rgba(59,50,43,.9); color:#fff7ea; font-size:11px; padding:7px 12px; border-radius:99px;
    opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;
  }
  #bubble.show{opacity:1;}
  .trayRow{display:flex; gap:7px;}
  #boxes{margin-top:2px;}
  .box{
    flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 8px 6px;
    box-shadow:0 3px 10px rgba(92,66,44,.06); transition:transform .15s, box-shadow .2s, opacity .2s;
  }
  .box.hot{box-shadow:0 0 0 2px rgba(201,139,107,.35), 0 6px 18px rgba(92,66,44,.12);}
  .box.done{animation:boxDone .45s ease forwards;}
  @keyframes boxDone{0%{transform:scale(1);}45%{transform:scale(1.08);}100%{transform:scale(.9); opacity:0;}}
  .boxTop{display:flex; align-items:center; gap:5px;}
  .boxIcon{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .boxName{font-size:11px; font-weight:700; color:#5a4a3d; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .boxCount{margin-left:auto; font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .dots{display:flex; gap:3px; margin-top:5px;}
  .dots i{flex:1; height:4px; border-radius:99px; background:#e9dccb;}
  .dots i.on{background:var(--accent);}
  .slot{
    flex:1; aspect-ratio:1; border-radius:10px; border:1.5px dashed #d9c7b1; background:rgba(255,250,243,.55);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; font-size:18px; color:#c9b8a4; cursor:pointer; transition:transform .15s, background .2s;
    min-width:0;
  }
  .slot .se{font-size:17px; line-height:1.1;}
  .slot .se svg{width:19px; height:19px; display:block; fill:none; stroke:#7a6a58; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round;}
  .slot .sl{font-size:7px; line-height:1.15; color:#8b7a68; letter-spacing:.4px;}
  .slot.filled{background:#fffaf3; border-style:solid; border-color:#e2cdb4; box-shadow:0 2px 0 rgba(120,90,60,.10);}
  .slot.shake{animation:shakeSlot .3s;}
  @keyframes shakeSlot{0%,100%{transform:translateX(0);}30%{transform:translateX(-3px);}70%{transform:translateX(3px);}}
  .slotTag{display:flex; align-items:center; justify-content:space-between; font-size:10px; color:var(--muted); margin:2px 1px 0;}
  .slotTag b{font-variant-numeric:tabular-nums; color:#6b5b4c;}
  footer{display:flex; gap:8px; margin-top:2px;}
  button.ui{
    flex:1; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#fffaf3; color:#5a4a3d;
    font-size:12px; font-weight:600; cursor:pointer; box-shadow:0 2px 0 rgba(120,90,60,.08);
  }
  button.ui:active{transform:translateY(1px);}
  #perf{margin-top:4px; font:11px ui-monospace,Menlo,Consolas,monospace; color:#6d8a6a; background:#f7fbf4; border:1px solid #dce8d6; border-radius:8px; padding:5px 9px;}
  #logPanel{background:#fbf7f0; border:1px solid #e6d9c8; border-radius:10px; overflow:hidden; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .logHead{display:flex; gap:8px; align-items:center; padding:6px 9px; background:#f4ecdf; font-size:10px; color:#8a7a68;}
  .logHead button{font-size:10px; padding:2px 8px; border:1px solid #d9c7b1; background:#fffaf3; color:#6b5b4c; border-radius:5px; cursor:pointer;}
  #logBody{max-height:132px; overflow-y:auto; padding:5px 9px; font-size:10px; line-height:1.7; color:#8a7a68;}
  #logBody .ev b{color:#b07b55; font-weight:400;}
  #logBody .d{color:#b3a392;}
  .modalBg{position:fixed; inset:0; z-index:2000; background:rgba(52,40,30,.45); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:18px;}
  .modalBg.hidden{display:none;}
  .modal{
    width:100%; max-width:380px; background:#fffaf3; border:1px solid #eadbc7; border-radius:20px; padding:20px 18px 16px;
    box-shadow:0 24px 60px rgba(52,40,30,.25); text-align:center;
  }
  .modal h1{font-size:22px; margin:0 0 4px; letter-spacing:3px;}
  .modal h2{font-size:18px; margin:0 0 8px; color:#5a4a3d;}
  .modal .sub{font-size:12px; color:var(--muted); margin:0 0 14px; line-height:1.6;}
  .modal p{font-size:12px; color:#6b5b4c; line-height:1.7; margin:7px 0;}
  .rules{text-align:left; background:#fdf5e9; border:1px dashed #e2cfb4; border-radius:10px; padding:9px 11px; font-size:11.5px; color:#6b5b4c; line-height:1.7; margin:0 0 14px;}
  .rules b{color:#a8694a;}
  .modalBtns{display:flex; gap:8px; margin-top:14px;}
  .modalBtns button{flex:1; padding:11px 8px; border-radius:11px; border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:700; cursor:pointer;}
  .modalBtns button.ghost{background:#efe4d5; color:#5a4a3d;}
  .stars{font-size:28px; letter-spacing:6px; color:var(--gold); margin:6px 0 4px; height:34px;}
  .statRow{display:flex; justify-content:space-between; font-size:12px; color:#6b5b4c; padding:5px 2px; border-bottom:1px solid #f0e4d5;}
  .statRow:last-child{border-bottom:none;}
  .statRow b{color:#3b322b; font-variant-numeric:tabular-nums;}
  .storyCard{text-align:left; background:#f8efe2; border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.75; color:#6b5b4c; margin:10px 0 2px;}
  .adCount{font-size:42px; font-weight:800; color:var(--accent); margin:8px 0 2px;}
  /* M2-B2：复原陈设（纯 CSS 手绘，不依赖 emoji 字体） */
  #room.restored{box-shadow:inset 0 0 70px rgba(255,214,140,.35);}
  #restoreLayer{position:absolute; inset:0; z-index:6; pointer-events:none;}
  .furn{position:absolute; opacity:0; transform:translateY(12px) scale(.97); transition:opacity .55s ease, transform .6s cubic-bezier(.2,.8,.3,1);}
  #room.restored .furn{opacity:1; transform:translateY(0) scale(1);}
  .f-sofa{background:#cba98a; border-radius:10px 10px 5px 5px; box-shadow:inset 0 -6px 0 rgba(120,90,60,.16);}
  .f-sofa::before{content:""; position:absolute; left:-5%; right:-5%; top:-30%; height:40%; background:#d6b696; border-radius:8px; box-shadow:inset 0 -3px 0 rgba(120,90,60,.10);}
  .f-sofa::after{content:""; position:absolute; left:5%; right:5%; bottom:8%; height:24%; background:rgba(255,250,243,.6); border-radius:4px;}
  .f-bed{background:#e8d5bf; border-radius:6px; box-shadow:inset 0 7px 0 #f4e6d6, inset 0 -5px 0 rgba(120,90,60,.14);}
  .f-bed::before{content:""; position:absolute; left:6%; top:12%; width:26%; height:32%; background:#fffaf3; border-radius:4px; box-shadow:0 1px 2px rgba(120,90,60,.12);}
  .f-desk{background:#c8a983; border-radius:4px; box-shadow:0 2px 0 rgba(120,90,60,.12);}
  .f-desk::before,.f-desk::after{content:""; position:absolute; bottom:-150%; width:10%; height:150%; background:#b2906c; border-radius:2px;}
  .f-desk::before{left:10%;}
  .f-desk::after{right:10%;}
  .f-shelf{background:#c8a983; border-radius:3px; box-shadow:0 3px 0 rgba(120,90,60,.14);}
  .f-shelf::before{content:""; position:absolute; left:3%; right:3%; bottom:100%; height:260%; border-radius:2px;
    background:repeating-linear-gradient(90deg,#c8a983 0 2%, #a8c0e8 2% 5%, #c8a983 5% 8%, #e8b8a0 8% 11%, #c8a983 11% 14%, #9fcdb4 14% 17%, #c8a983 17% 20%);}
  .f-wardrobe{background:#c19a76; border-radius:5px; box-shadow:inset 0 5px 0 rgba(255,250,243,.18);}
  .f-wardrobe::before{content:""; position:absolute; left:50%; top:2%; bottom:2%; width:2px; background:rgba(255,250,243,.5);}
  .f-wardrobe::after{content:""; position:absolute; left:calc(50% - 7px); top:48%; width:4px; height:4px; border-radius:50%; background:#7d5f45; box-shadow:7px 0 0 #7d5f45;}
  .f-table{background:#cfa87f; border-radius:4px;}
  .f-table::before{content:""; position:absolute; left:50%; top:100%; width:10%; height:160%; margin-left:-5%; background:#b3906c; border-radius:0 0 2px 2px;}
  .f-crib{background:repeating-linear-gradient(90deg,#e0c3a0 0 5%, #fffaf3 5% 7.5%); border-radius:4px; box-shadow:inset 0 5px 0 #e6cbab;}
  .f-clock{border-radius:50%; background:#f6ecdc; border:3px solid #b08a63; box-shadow:0 4px 10px rgba(90,60,35,.16);}
  .f-clock::before{content:""; position:absolute; left:50%; top:24%; width:2px; height:28%; margin-left:-1px; background:#8a6a4a; transform-origin:bottom center; transform:rotate(28deg);}
  .f-clock::after{content:""; position:absolute; left:50%; top:50%; width:20%; height:2px; margin-top:-1px; background:#8a6a4a;}
  .f-plant{border-radius:3px 3px 8px 8px; background:#c98b6b; box-shadow:inset 0 3px 0 rgba(255,250,243,.35);}
  .f-plant::before{content:""; position:absolute; left:50%; bottom:92%; width:120%; height:150%; margin-left:-60%; border-radius:50% 50% 44% 44%;
    background:radial-gradient(ellipse at 50% 82%, #9bbf9a 0%, #7fae7a 62%, rgba(127,174,122,0) 74%);}
  .f-lamp{background:#e8c898; clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);}
  .f-lamp::before{content:""; position:absolute; left:50%; top:100%; width:8%; height:150%; margin-left:-4%; background:#b08a63;}
  .f-rug{border-radius:50%; background:radial-gradient(ellipse at center,#ecd3b4 0%, #e6c9a8 60%, rgba(230,201,168,0) 74%);}
  .f-frame{border:4px solid #dcbb93; border-radius:2px; background:linear-gradient(160deg,#cfe0ea,#eef6fa);}
  .f-frame::after{content:""; position:absolute; left:50%; top:50%; width:34%; height:34%; margin:-17% 0 0 -17%; border-radius:50%; background:rgba(140,170,190,.35);}
  .f-box{background:#d7b489; border-radius:2px; box-shadow:inset 0 0 0 2px rgba(120,90,60,.18);}
  .f-box::before{content:""; position:absolute; left:0; right:0; top:42%; height:16%; background:rgba(120,90,60,.22);}
  /* M2-B2：日记 / 门牌墙面板 */
  .diaryCard{text-align:left; background:#f8efe2; border-radius:10px; padding:10px 12px; margin:8px 0 2px;}
  .diaryHead{display:flex; justify-content:space-between; font-size:10px; color:#a08e7c; letter-spacing:.5px; margin-bottom:5px;}
  .diaryCard b{display:block; font-size:12.5px; color:#8a5a3c; margin-bottom:4px;}
  .diaryCard p{margin:0; font-size:11.5px; line-height:1.75; color:#6b5b4c;}
  .diarySign{margin-top:6px; font-size:10.5px; color:#a08e7c; text-align:right;}
  .houseDone{margin-top:8px; font-size:11px; color:#8a6a2a; background:#fdf1d8; border:1px solid #e8d2a4; border-radius:8px; padding:7px 9px;}
  .sheetBg{position:fixed; inset:0; z-index:2100; background:rgba(52,40,30,.5); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:16px;}
  .sheetBg.hidden{display:none;}
  .sheet{width:100%; max-width:400px; max-height:82dvh; overflow-y:auto; background:#fffaf3; border:1px solid #eadbc7; border-radius:18px; padding:16px 16px 14px; box-shadow:0 24px 60px rgba(52,40,30,.3);}
  .sheetTop{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .sheetTop h2{margin:0; font-size:17px; color:#5a4a3d; letter-spacing:1px;}
  .sheetClose{font-size:11px; padding:5px 11px; border:1px solid #d9c7b1; background:#fffaf3; color:#6b5b4c; border-radius:99px; cursor:pointer;}
  .sheetSub{font-size:11px; color:#a08e7c; margin:6px 0 10px; line-height:1.6;}
  .houseBlock{margin-bottom:12px; border-top:1px dashed #eadbc7; padding-top:10px;}
  .houseBlock:first-of-type{border-top:none; padding-top:0;}
  .houseHead{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:#8c7f73; margin-bottom:6px;}
  .houseHead b{font-size:12.5px; color:#5a4a3d;}
  .doors{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .door{position:relative; border:1px solid #e6d9c8; border-radius:9px; padding:7px 3px 6px; text-align:center; background:#fdf6ec; opacity:.55;}
  .door.on{opacity:1; background:#fff3dd; border-color:#e2c79a; box-shadow:inset 0 0 0 2px rgba(217,164,65,.14);}
  .plate{display:block; font-size:11.5px; font-weight:700; color:#8c7f73; font-variant-numeric:tabular-nums;}
  .door.on .plate{color:#a8694a;}
  .rname{display:block; font-size:9px; color:#8c7f73; margin-top:2px;}
  .keyDot{display:block; width:5px; height:5px; border-radius:50%; background:#e0d2bd; margin:5px auto 0;}
  .door.on .keyDot{background:var(--gold); box-shadow:0 0 6px rgba(217,164,65,.6);}
  .keyBar{display:flex; justify-content:space-between; font-size:11px; color:#6b5b4c; border-top:1px solid #eadbc7; margin-top:6px; padding-top:9px;}
  .jItem{border-bottom:1px dashed #eadbc7; padding:9px 2px;}
  .jItem:last-child{border-bottom:none;}
  .jItem h4{margin:0 0 3px; font-size:12px; color:#5a4a3d;}
  .jMeta{font-size:9.5px; color:#a08e7c; margin-bottom:4px;}
  .jItem p{margin:0; font-size:11px; line-height:1.75; color:#6b5b4c;}
  .jItem.locked{opacity:.42;}
  .jItem.on{background:#fdf4e4; border-radius:8px; padding:9px 8px;}
  footer button.ui{font-size:11px;}
  /* M2-B3：提示高亮 / 道具面板 */
  .item.hint{animation:hintPulse 1s ease-in-out infinite; box-shadow:0 0 0 3px rgba(217,164,65,.55), 0 0 18px rgba(217,164,65,.5);}
  @keyframes hintPulse{0%,100%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1);}50%{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1.12);}}
  .propRow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 2px; border-bottom:1px dashed #eadbc7; font-size:11.5px; color:#6b5b4c;}
  .propRow:last-child{border-bottom:none;}
  .propRow .pv{font-size:10px; color:#a08e7c; margin-top:2px;}
  .propBtn{font-size:11px; padding:5px 10px; border-radius:99px; border:1px solid #d9c7b1; background:#fffaf3; color:#6b5b4c; cursor:pointer; white-space:nowrap; flex:0 0 auto;}

const LOG_KEY='lj_t003_telemetry_v1';
const SessionLog=(()=>{
  let all=[];
  try{ all=JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(e){ all=[]; }
  const save=()=>{ try{ localStorage.setItem(LOG_KEY, JSON.stringify(all.slice(-500))); }catch(e){} };
  const count=()=>{ const el=$('logCount'); if(el) el.textContent=all.length+' 条'; };
  function line(rec){
    const body=$('logBody'); if(!body) return;
    const div=document.createElement('div'); div.className='ev';
    div.innerHTML=`<b>[${rec.ts} ${rec.run}]</b> ${rec.evt} <span class="d">${JSON.stringify(rec.data)}</span>`;
    body.appendChild(div);
    while(body.children.length>200) body.removeChild(body.firstChild);
    body.scrollTop=body.scrollHeight;
  }
  function push(rec){ all.push(rec); if(all.length>500) all.shift(); save(); line(rec); count(); }
  function renderAll(){ const b=$('logBody'); if(b) b.innerHTML=''; all.forEach(line); count(); }
  function copy(){
    const json=JSON.stringify(all,null,1);
    const ok=()=>{ const t=$('logTitle'); if(t){ const old=t.textContent; t.textContent='已复制 '+all.length+' 条埋点'; setTimeout(()=>t.textContent=old,1500); } };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(json).then(ok).catch(fallback); }
    else fallback();
    function fallback(){
      const ta=document.createElement('textarea'); ta.value=json; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ window.prompt('复制埋点 JSON：', json); }
      ta.remove();
    }
  }
  function clear(){ all=[]; save(); const b=$('logBody'); if(b) b.innerHTML=''; count(); }
  return {push, renderAll, copy, clear};
})();

// ---------- 性能 ----------
const Perf={
  total:0, frames:0, acc:0, fps:0, minFps:999, sumMs:0, maxMs:0, slow:0, uiT:0,
  tick(dt, entities){
    const ms=dt*1000; this.total++; this.frames++; this.acc+=dt; this.sumMs+=ms;
    if(ms>this.maxMs) this.maxMs=ms;
    if(ms>50) this.slow++;
    if(this.acc>=1){ this.fps=Math.round(this.frames/this.acc); if(this.fps<this.minFps) this.minFps=this.fps; this.frames=0; this.acc=0; }
    this.uiT+=dt;
    if(this.uiT>=0.5){
      this.uiT=0;
      const heap=performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576)+'MB':'-';
      $('perf').textContent=`FPS ${this.fps||'-'} | 平均帧 ${(this.sumMs/this.total).toFixed(1)}ms | 最大帧 ${this.maxMs.toFixed(0)}ms | 慢帧(>50ms) ${this.slow} | 实体 ${entities} | JS堆 ${heap}`;
    }
  },
  summary(){
    return {avgFps:+(this.total/(this.sumMs/1000)).toFixed(1), minFps:this.minFps===999?null:this.minFps,
      avgMs:+(this.sumMs/this.total).toFixed(1), maxMs:+this.maxMs.toFixed(1), slow:this.slow, samples:this.total};
  }
};

// ---------- 音效 ----------
let AC=null;
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended') AC.resume();
}
function tone(freq, dur=.08, type='sine', vol=.05, delay=0){
  if(!AC) return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function sfxSnap(combo){ const f=[523,587,659,784,880][Math.min(4,combo-1)]; tone(f,.07,'triangle',.06); tone(f*2,.04,'sine',.02,.02); }
function sfxSlot(){ tone(220,.07,'sine',.04); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.05,i*.09)); }
function sfxFail(){ tone(180,.18,'sawtooth',.045); tone(140,.22,'sawtooth',.035,.12); }

// ---------- 生成关卡 ----------
function makeBox(cat, target){ return {cat, count:0, target, done:false}; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const SPOTS=[[18,24],[44,19],[70,25],[24,51],[50,47],[77,52],[36,74],[64,72]];
function layoutItems(){
  const n=G.items.length;
  const piles=Math.min(SPOTS.length, Math.max(4, Math.round(n/3.6)));
  const spots=shuffle(SPOTS.slice()).slice(0,piles);
  shuffle(G.items);
  // 暂时没有箱子的类别先垫底，能装箱的类别放上层，避免开局就被压在下面
  const active=new Set(G.boxes.map(b=>b.cat));
  const ordered=G.items.slice().sort((a,b)=>(active.has(a.cat)?1:0)-(active.has(b.cat)?1:0));
  ordered.forEach((it,i)=>{
    const p=i%piles, layer=Math.floor(i/piles);
    const s=spots[p];
    it.x=Math.max(8,Math.min(84, s[0] + (layer%2?2.4:-2.4) + (Math.random()*3-1.5)));
    it.y=Math.max(12,Math.min(80, s[1] + layer*2.4 + (Math.random()*3-1.5)));
    it.z=p*30+layer+1;
    it.rot=(Math.random()*14-7).toFixed(1);
  });
}

function renderRoom(){
  itemsEl.innerHTML='';
  G.items.forEach(it=>{
    if(it.removed) return;
    const b=document.createElement('button');
    b.className='item'; b.type='button';

    b.style.setProperty('--r', it.rot+'deg');
    b.innerHTML=`<span class="ie">${ico(it.emoji)}</span><span class="il">${CATS[it.cat].name}</span>`;
    b.setAttribute('aria-label', CATS[it.cat].name+'物品');
    b.addEventListener('click', ()=>clickItem(it.uid));
    it.el=b; itemsEl.appendChild(b);
  });
  requestAnimationFrame(updateBlocked);
}

function updateBlocked(){
  const alive=G.items.filter(i=>!i.removed && i.el);
  alive.forEach(it=>{
    const r=it.el.getBoundingClientRect();
    let blocked=false;
    for(const o of alive){
      if(o===it || o.z<=it.z) continue;
      const q=o.el.getBoundingClientRect();
      const ox=Math.max(0, Math.min(r.right,q.right)-Math.max(r.left,q.left));
      const oy=Math.max(0, Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top));
      if(ox*oy > r.width*r.height*0.16){ blocked=true; break; }
    }
    it.blocked=blocked;
    it.el.classList.toggle('blocked', blocked);
  });
}

function renderBoxes(){

let bubbleT=0;

function shake(el){ if(!el) return; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),380); }
function shakeSlot(i){ const el=slotsEl.children[i]; if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),320); } }

function burst(el){
  if(!el) return;
  const r=el.getBoundingClientRect(), rr=room.getBoundingClientRect();
  const x=r.left-rr.left+r.width/2, y=r.top-rr.top+r.height/2;

    s.className='spark';

    s.style.setProperty('--dx',(Math.random()*90-45)+'px');
    s.style.setProperty('--dy',(Math.random()*-70-10)+'px');

// ---------- 交互 ----------
function removeFromRoom(it){
  it.removed=true;
  if(it.el){ const el=it.el; el.classList.add('taken'); setTimeout(()=>el.remove(),250); }
}

function clickItem(uid){
  if(G.state!=='play') return;
  ensureAudio();
  const it=G.items.find(i=>i.uid===uid); if(!it || it.removed) return;
  if(it.blocked){ bubble('被压住了 · 先清理上面的东西'); shake(it.el); log('blocked_click',{cat:it.cat}); return; }
  const box=G.boxes.find(b=>b.cat===it.cat && !b.done && b.count<b.target);
  if(box){ deposit(it,box,'room'); }
  else if(G.slots.length<G.maxSlots){ storeSlot(it); }
  else { fail('slot_full'); }
}

function deposit(item, box, source){
  const now=performance.now();
  G.combo = (now-G.lastDep < 2600) ? Math.min(5,G.combo+1) : 1;
  G.lastDep=now;
  const gain=10*G.combo;
  G.levelScore+=gain; box.count++;
  burst(item.el || room);
  sfxSnap(G.combo);
  if(source==='room') removeFromRoom(item);
  log('deposit',{cat:item.cat, to:box.cat, progress:box.count+'/'+box.target, gain, combo:G.combo, source});
  renderBoxes(); renderSlots(); updateHUD(); updateBlocked();
  if(box.count>=box.target) completeBox(box);
  else bubble(`+${gain} · ${CATS[box.cat].name}箱 ${box.count}/${box.target}`);
}

function storeSlot(it){
  G.slots.push({cat:it.cat, emoji:it.emoji});
  removeFromRoom(it);
  sfxSlot();
  log('slot_store',{cat:it.cat, slots:G.slots.length+'/'+G.maxSlots});
  renderSlots(); updateHUD(); updateBlocked();
  if(G.slots.length>=G.maxSlots) bubble('槽位满了 · 下次只能拿能装箱的');
  else bubble('放不进箱子 · 先存进临时槽');
  checkLevelClear();
}

function clickSlot(i){
  if(G.state!=='play') return;
  const s=G.slots[i]; if(!s) return;
  const box=G.boxes.find(b=>b.cat===s.cat && !b.done && b.count<b.target);
  if(box){ G.slots.splice(i,1); deposit(s,box,'slot'); }
  else { bubble(CATS[s.cat].name+'的箱子还没出现 · 先清理其他物品'); shakeSlot(i); log('slot_reject',{cat:s.cat}); }
}

function completeBox(box){
  box.done=true;
  G.levelScore+=50*G.combo;
  sfxWin();
  log('box_clear',{cat:box.cat, bonus:50*G.combo, levelScore:G.levelScore});
  renderBoxes(); updateHUD();
  setTimeout(()=>{
    G.boxes=G.boxes.filter(b=>b!==box);
    while(G.pending.length && G.boxes.length<G.boxSlots) G.boxes.push(G.pending.shift());
    renderBoxes();
    drainSlots();
    checkLevelClear();
  },430);
}

// 新箱子出现时，临时槽里同类物品自动归位（避免房间清空却卡在槽里）
function drainSlots(){
  if(!G.slots.length) return 0;
  let moved=0;
  for(let i=G.slots.length-1;i>=0;i--){
    const s=G.slots[i];
    const box=G.boxes.find(b=>b.cat===s.cat && !b.done && b.count<b.target);
    if(box){ G.slots.splice(i,1); deposit(s,box,'slot_auto'); moved++; }
  }
  if(moved){
    renderSlots(); updateHUD(); updateBlocked();
    log('slot_auto',{moved, slots:G.slots.length+'/'+G.maxSlots});
  }
  return moved;
}

function checkLevelClear(){
  if(G.state!=='play') return;
  const allGone=G.items.every(i=>i.removed);
  const noSlots=G.slots.length===0;
  const boxesDone=G.boxes.every(b=>b.done) && G.pending.length===0;
  if(allGone && noSlots && boxesDone){ levelClear(); return; }
  if(allGone && G.slots.length>0){
    const hasMatch=G.boxes.some(b=>!b.done && G.slots.some(s=>s.cat===b.cat));
    if(!hasMatch && G.pending.length){
      // 兜底：房间已空，直接放行下一只箱子，避免无处可点（箱位满了就等清箱回调再放）
      if(G.boxes.length<G.boxSlots){ G.boxes.push(G.pending.shift()); renderBoxes(); drainSlots(); return; }
      bubble('等这箱清完 · 下一只马上出来');
      return;
    }
    bubble(hasMatch?'点下方临时槽 · 把存着的东西放进箱子':'等这箱装满 · 临时槽会自动归位');
  }
}

// ---------- 结算 ----------
function levelClear(){
  if(G.state!=='play') return;
  G.state='restore';
  const idx=G.levelIdx, L=LEVELS[idx];
  const ratio=G.time/L.time;
  const stars=ratio>=.45?3:ratio>=.2?2:1;
  const bonus=Math.round(G.time*2);
  G.levelScore+=bonus; G.runScore+=G.levelScore;
  const firstTime=!G.cleared.includes(idx);
  if(firstTime){ G.cleared.push(idx); G.cleared.sort((a,b)=>a-b); saveProgress(); }
  const houseLevels=themeLevels(L.theme);
  const houseDone=firstTime && houseLevels.every(i=>G.cleared.includes(i));
  updateStory(L.storyEnd); updateHUD();
  sfxWin();
  log('level_clear',{level:idx+1, room:L.name, stars, time:+G.time.toFixed(1), bonus, levelScore:G.levelScore, runScore:G.runScore, keys:G.cleared.length, firstTime, perf:Perf.summary()});
  playRestore(idx, ()=>{
    if(houseDone) log('house_complete',{theme:L.theme, house:THEMES[L.theme].name, keys:G.cleared.length});
    G.state='clear';
    showClearModal(idx, stars, bonus, houseDone);
  });
}

      <b>${d.title}</b>
      <p>${d.body}</p>
      <div class="diarySign">—— ${d.sign}</div>
    </div>
    ${houseDone?`<div class="houseDone">${THEMES[L.theme].name} · 门牌全部点亮，获得整串钥匙</div>`:''}
    <div class="statRow"><span>本间得分</span><b>${G.levelScore}</b></div>
    <div class="statRow"><span>剩余时间奖励</span><b>+${bonus}</b></div>
    <div class="statRow"><span>累计得分</span><b>${G.runScore}</b></div>
    <div class="statRow"><span>钥匙 / 门牌</span><b>${G.cleared.length} / ${LEVELS.length}</b></div>
    <div class="modalBtns"><button id="diaryBtn" class="ghost">搬家日记</button><button id="nextBtn">${last?'查看整理':'下一间房'}</button></div>
  `);
  $('diaryBtn').onclick=()=>openJournal(idx);
  $('nextBtn').onclick=()=>{
    hideModal();
    if(last) endRun(); else startLevel(idx+1);
  };
}

function endRun(){
  G.state='idle';
  log('session_end',{runScore:G.runScore, levels:LEVELS.length});
  showModal(`
    <h1>归位</h1>
    <p class="sub">三户人家、十二间房，都整理完了。<br>你把最后一把钥匙放回前台。</p>
    <div class="statRow"><span>本次整理</span><b>${LEVELS.length} 间房</b></div>
    <div class="statRow"><span>总分</span><b>${G.runScore}</b></div>
    <div class="modalBtns"><button id="againBtn">再整理一次</button></div>
  `);
  $('againBtn').onclick=()=>{ hideModal(); startRun(); };
}

function fail(reason){
  if(G.state!=='play') return;
  G.state='fail';
  sfxFail();
  log('level_fail',{reason, level:G.levelIdx+1, remaining:G.items.filter(i=>!i.removed).length, slots:G.slots.length+'/'+G.maxSlots, time:+G.time.toFixed(1)});
  const canAd = reason==='timeout' ? !G.adTime : !G.adSlot;
  log('ad_offer',{placements:[reason==='timeout'?'timeout':'slot'], reason, canAd, noAds:G.noAds, source:'fail'});
  showModal(`
    <h2>${reason==='timeout'?'时间到了':'槽位满了'}</h2>
    <p>${reason==='timeout'?'这间房还差一点。再给你 20 秒，把最后几件归位。':'临时槽被塞满了。清出 2 个位置，还能继续。'}</p>
    <div class="modalBtns">
      ${canAd?`<button id="adBtn">${G.noAds?'直接领取':`看广告 ${reason==='timeout'?'+20 秒':'+2 槽位'}`}</button>`:''}
      <button id="retryBtn" class="ghost">重试本间</button>
    </div>
  `);
  $('retryBtn').onclick=()=>{ hideModal(); startLevel(G.levelIdx); };
  if(canAd) $('adBtn').onclick=()=>playAd(reason);
}

function playAd(kind){
  const seq=++G.adSeq;
  G.adPrev=G.state;
  G.state='ad';
  log('ad_start',{placement:kind, noAds:G.noAds});
  if(G.noAds){
    // 已购去广告卡：不看片，直接发放
    grant(kind,'noads');
    log('ad_watched',{placement:kind, source:'noads'});
    return;
  }
  showModal(`<h2>广告播放中…</h2><p class="sub">灰盒模拟 · 3 秒后自动发放</p><div class="adCount" id="adCount">3</div>`);
  let n=3;
  const t=setInterval(()=>{
    if(G.adSeq!==seq){ clearInterval(t); return; }
    n--;
    if(n<=0){
      clearInterval(t);
      grant(kind,'ad');
      log('ad_watched',{placement:kind, source:'ad'});
    } else {
      const el=$('adCount'); if(el) el.textContent=n;
    }
  },1000);
}

const AD_LABEL={timeout:'+20 秒', slot:'+2 槽位', hint:'提示', box:'+1 箱位'};
function grant(kind, source){
  if(kind==='timeout'){ G.adTime=true; G.time+=20; }
  else if(kind==='slot'){ G.adSlot=true; G.maxSlots+=2; }
  else if(kind==='hint'){ G.adHint=true; }
  else if(kind==='box'){ G.adBox=true; G.boxSlots=4; }
  // 从失败弹窗/广告态回来才恢复进行中；结算/复原态不改状态
  const prev=G.adPrev;
  G.state=(prev==='fail'||prev==='ad'||!prev)?'play':prev;
  G.adPrev=null;
  hideModal();
  if(kind==='box'){ while(G.pending.length && G.boxes.length<G.boxSlots) G.boxes.push(G.pending.shift()); }
  renderBoxes(); renderSlots(); updateHUD(); updateBlocked();
  if(kind==='hint') showHint();
  bubble('已发放 · '+AD_LABEL[kind]+' · 继续整理');
  log('ad_reward',{placement:kind, source, maxSlots:G.maxSlots, boxSlots:G.boxSlots, time:+G.time.toFixed(1)});
}

// M2-B3：提示——高亮一件当前可装箱的物品，6 秒后自动消失
function showHint(){
  const cand=G.items.filter(i=>!i.removed && !i.blocked && i.el);
  if(!cand.length){ bubble('房间里暂时没有可提示的物品'); log('hint_empty',{level:G.levelIdx+1}); return; }
  const pick=cand.find(i=>G.boxes.some(b=>!b.done && b.cat===i.cat && b.count<b.target)) || cand[0];
  pick.el.classList.add('hint');
  clearTimeout(G.hintT);
  G.hintT=setTimeout(()=>{ if(pick.el) pick.el.classList.remove('hint'); },6000);
  log('hint_show',{cat:pick.cat, level:G.levelIdx+1});
}

// M2-B3：道具 / 商店（广告位、去广告卡、主题包）
function openProps(){
  const keys=G.cleared.length;
  const offers=[];
  if(!G.adHint) offers.push('hint');
  if(!G.adBox) offers.push('box');
  if(!G.adSlot) offers.push('slot');
  if(!G.adTime) offers.push('timeout');
  log('prop_open',{keys, noAds:G.noAds, pack:G.pack, offers});
  log('ad_offer',{placements:offers, noAds:G.noAds, source:'props'});
  const packs=PACKS.map(p=>{
    const ok=packUnlocked(p.id);
    const on=G.pack===p.id;
    return `<div class="packCard${ok?'':' locked'}${on?' on':''}" data-pack="${p.id}">
      <b>${p.name}</b>${ok?(on?'使用中':'已解锁'):p.desc}</div>`;
  }).join('');
  sheet(`<div class="sheetTop"><h2>道具 · 商店（灰盒）</h2><button class="sheetClose" id="sheetClose">关闭</button></div>
    <p class="sheetSub">零现金原型：所有广告与内购均为本地模拟，解锁状态写入 localStorage。${G.noAds?'<br><b>去广告卡已生效</b>：奖励直接发放。':''}</p>
    <div class="propRow"><div><b>提示</b><div class="pv">高亮一件可装箱物品 · 每关 1 次</div></div>
      ${G.state!=='play'?'<button class="propBtn" disabled>整理中可用</button>'
        :G.adHint?'<button class="propBtn" disabled>本关已用</button>'
        :`<button class="propBtn${G.noAds?' on':''}" id="pHint">${G.noAds?'直接领取':'看广告'}</button>`}</div>
    <div class="propRow"><div><b>扩箱</b><div class="pv">本关同时多出 1 只收纳箱 · 每关 1 次</div></div>
      ${G.state!=='play'?'<button class="propBtn" disabled>整理中可用</button>'
        :G.adBox?'<button class="propBtn" disabled>本关已用</button>'
        :`<button class="propBtn${G.noAds?' on':''}" id="pBox">${G.noAds?'直接领取':'看广告'}</button>`}</div>
    <div class="propRow"><div><b>扩槽 / 续时</b><div class="pv">失败时弹出 · 扩槽 +2、续时 +20 秒</div></div>
      <button class="propBtn" disabled>失败时触发</button></div>
    <div class="propRow"><div><b>去广告卡</b><div class="pv">模拟内购 · 一键切换购买状态</div></div>
      <button class="propBtn${G.noAds?' on':''}" id="pNoAds">${G.noAds?'已购 · 点击退款':'模拟购买'}</button></div>
    <div class="jItem"><h4>主题包</h4><div class="jMeta">按整栋楼钥匙数解锁 · 解锁后可套用房间配色</div>
      <div class="packGrid">${packs}</div></div>`);
  $('sheetClose').onclick=closeSheet;
  const pHint=$('pHint'), pBox=$('pBox');
  if(pHint) pHint.onclick=()=>{ closeSheet(); playAd('hint'); };
  if(pBox) pBox.onclick=()=>{ closeSheet(); playAd('box'); };
  $('pNoAds').onclick=()=>{
    G.noAds=!G.noAds; saveAds();
    log('noads_toggle',{on:G.noAds});
    openProps();
  };
  $('sheet').querySelectorAll('.packCard').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.pack;
      if(!packUnlocked(id)){
        const p=PACKS.find(x=>x.id===id);
        log('pack_locked',{pack:id, need:p.need, keys:G.cleared.length});
        bubble(`主题包「${p.name}」需要 ${p.need} 把钥匙 · 现在 ${G.cleared.length}`);
        return;
      }
      G.pack=(G.pack===id)?null:id;
      saveAds();
      log('pack_select',{pack:G.pack, keys:G.cleared.length});
      applySkin();
      openProps();
    };
  });
}

// 主题包只影响配色，不重开关卡
function applySkin(){
  const L=LEVELS[G.levelIdx];
  const skin=G.pack||L.theme;
  room.dataset.theme=skin;
  $('roomTag').textContent=THEMES[skin].name+(G.pack&&G.pack!==L.theme?' · 主题包':'');
}

// ---------- 弹窗 ----------
function showModal(html){ $('modal').innerHTML=html; $('modalBg').classList.remove('hidden'); }
function hideModal(){ $('modalBg').classList.add('hidden'); }
function sheet(html){ $('sheet').innerHTML=html; $('sheetBg').classList.remove('hidden'); }
function closeSheet(){ $('sheetBg').classList.add('hidden'); }

// ---------- M2-B2：搬家日记 ----------
function openJournal(highlight){
  const unlocked=G.cleared;
  log('journal_open',{unlocked:unlocked.length, total:LEVELS.length, highlight:(highlight==null?null:highlight+1)});
  const items=DIARIES.map((d,i)=>{
    if(!unlocked.includes(i)){
      return `<div class="jItem locked"><h4>${String(i+1).padStart(2,'0')} · 未解锁</h4><div class="jMeta">整理完「${LEVELS[i].name}」后解锁</div></div>`;
    }
    return `<div class="jItem${i===highlight?' on':''}">
      <h4>${String(i+1).padStart(2,'0')} · ${d.title}</h4>
      <div class="jMeta">${LEVELS[i].owner} · ${LEVELS[i].name} · ${d.day}</div>
      <p>${d.body}</p>
      <div class="diarySign">—— ${d.sign}</div>
    </div>`;
  }).join('');
  sheet(`<div class="sheetTop"><h2>搬家日记</h2><button class="sheetClose" id="sheetClose">关闭</button></div>
    <p class="sheetSub">已解锁 ${unlocked.length} / ${LEVELS.length} 段 · 每整理完一间房，解锁一页。</p>
    <div class="journalList">${items}</div>`);
  $('sheetClose').onclick=closeSheet;
}

// ---------- M2-B2：门牌墙 / 整栋楼进度 ----------
function openBuilding(){
  const keys=G.cleared.length;
  log('building_progress',{keys, total:LEVELS.length, houses:HOUSE_KEYS.map(t=>({theme:t, done:themeLevels(t).filter(i=>G.cleared.includes(i)).length, total:themeLevels(t).length}))});
  const blocks=HOUSE_KEYS.map(t=>{
    const idxs=themeLevels(t);
    const done=idxs.filter(i=>G.cleared.includes(i)).length;
    return `<div class="houseBlock">
      <div class="houseHead"><b>${THEMES[t].name}</b><span>${done} / ${idxs.length} 把钥匙</span></div>
      <div class="doors">${idxs.map(i=>`<div class="door${G.cleared.includes(i)?' on':''}">
        <span class="plate">${String(i+1).padStart(2,'0')}</span>
        <span class="rname">${LEVELS[i].name}</span>
        <span class="keyDot"></span>
      </div>`).join('')}</div>
    </div>`;
  }).join('');
  sheet(`<div class="sheetTop"><h2>门牌墙</h2><button class="sheetClose" id="sheetClose">关闭</button></div>
    <p class="sheetSub">整栋楼 ${keys} / ${LEVELS.length} 把钥匙 · 每复原一间房，点亮一块门牌。</p>
    ${blocks}
    <div class="keyBar"><span>总钥匙</span><b>${keys} / ${LEVELS.length}</b></div>`);
  $('sheetClose').onclick=closeSheet;
}

function startScreen(){
  G.state='idle';
  showModal(`
    <h1>归位</h1>
    <p class="sub">收纳屋 · 3 个主题、12 间房。<br>把别人不愿扔的东西，一件件放回它该在的地方。</p>
    <div class="rules">
      <b>怎么玩</b><br>
      1. 点最上层的物品，放进对应的收纳箱；被压住的先清上面。<br>
      2. 暂时放不进的，塞进下方临时槽；槽满还硬拿，本间失败。<br>
      3. 清空房间 → 陈设逐件复原 → 解锁一页搬家日记。<br>
      4. 12 间房对应整栋楼 12 块门牌，整理过的房间会一直亮着。
    </div>
    <div class="modalBtns"><button id="startBtn">开始整理</button></div>
  `);
  $('startBtn').onclick=()=>{ ensureAudio(); hideModal(); startRun(); };
}

function startRun(){
  G.run='R'+Math.random().toString(36).slice(2,6).toUpperCase();
  G.runScore=0; G.levelIdx=0; G.state='idle';
  log('session_start',{mode:'graybox', version:'M2-B4.0', game:'guiwei', levels:LEVELS.length, noAds:G.noAds, pack:G.pack});
  startLevel(0);
}

// ---------- 循环 ----------
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  Perf.tick(dt, G.items.filter(i=>!i.removed).length);
  if(G.state==='play'){
    G.time-=dt;
    if(G.time<=0){ G.time=0; updateHUD(); fail('timeout'); }
    else if(Math.floor(G.time)!==Math.floor(G.time+dt)) updateHUD();
  }
  requestAnimationFrame(loop);
}

// ---------- 调试/验收通道 ----------
function debugClear(){
  if(G.state!=='play') return;
  G.items.forEach(it=>{ if(!it.removed){ it.removed=true; if(it.el) it.el.remove(); } });
  G.slots=[]; G.boxes.forEach(b=>{ b.count=b.target; b.done=true; }); G.boxes=[]; G.pending=[];
  G.time=Math.max(G.time,12);
  log('debug_clear',{level:G.levelIdx+1, note:'验收用：直接通关'});
  renderBoxes(); renderSlots(); updateHUD(); updateBlocked();
  levelClear();
}

$('btnRestart').onclick=()=>{ if(G.state==='play'||G.state==='fail'||G.state==='clear'||G.state==='restore'||G.state==='ad'){ hideModal(); log('restart',{level:G.levelIdx+1}); startLevel(G.levelIdx); } };
$('btnProps').onclick=()=>openProps();
$('btnDiary').onclick=()=>openJournal(G.state==='clear'?G.levelIdx:null);
$('btnBld').onclick=()=>openBuilding();
$('btnLog').onclick=()=>{ const p=$('logPanel'); p.style.display = p.style.display==='none'?'block':'none'; };
$('copyLog').onclick=()=>SessionLog.copy();
$('clearLog').onclick=()=>SessionLog.clear();
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){ if(G.state!=='idle'){ hideModal(); log('restart',{level:G.levelIdx+1, key:'R'}); startLevel(G.levelIdx); } }
  if(k==='l'){ const p=$('logPanel'); p.style.display = p.style.display==='none'?'block':'none'; }
  if(k==='n') openJournal(G.state==='clear'?G.levelIdx:null);
  if(k==='b') openBuilding();
  if(k==='p') openProps();
  if(k==='j') debugClear();
});
addEventListener('resize', ()=>{ requestAnimationFrame(updateBlocked); });

window.__Ctest={ G, startRun, startLevel, debugClear, updateBlocked, Perf, openJournal, openBuilding, openProps, playAd, grant, applySkin, LEVELS, DIARIES, RESTORE, PACKS };
window.__Cver='M2-B4.0';

loadProgress();
loadAds();
SessionLog.renderAll();
if(new URLSearchParams(location.search).has('qa')){ startRun(); } else { startScreen(); }
requestAnimationFrame(loop);
})();
</script>
