<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>妆匣 · 一日妆造师｜M2 垂直切片（LJ-T-005）</title>
<style>
  :root{
    --paper:#f1e9dc; --paper2:#fbf6ec; --card:#fffaf2;
    --ink:#3c332c; --muted:#8a7a6b; --faint:#b7a897;
    --line:#e2d5c3; --line2:#d3c2ac;
    --accent:#b4655a; --accent2:#8d6a4f; --gold:#b98c4a; --sage:#7f927f;
    --shadow:0 10px 26px rgba(92,66,44,.12);
    --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #fff9ee 0%, rgba(255,249,238,0) 62%),
      radial-gradient(rgba(120,95,70,.045) 1px, transparent 1px),
      linear-gradient(180deg,#f6efe4 0%, #eee3d3 100%);
    background-size:auto, 16px 16px, auto;
    color:var(--ink); font-family:var(--sans);
    display:flex; justify-content:center;
  }
  #app{width:100%; max-width:430px; min-height:100dvh; display:flex; flex-direction:column; gap:10px; padding:12px 12px 20px;}
  header{display:flex; flex-direction:column; gap:8px;}
  .brandRow{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
  .brand{font-family:var(--serif); font-size:24px; font-weight:700; letter-spacing:5px; line-height:1;}
  .brand span{display:block; margin-top:5px; font-family:var(--sans); font-size:10px; font-weight:400; letter-spacing:3px; color:var(--muted);}
  .ver{font-size:10px; color:var(--faint); letter-spacing:1px; padding-bottom:2px;}
  .hud{display:flex; gap:6px;}
  .hudChip{flex:1; background:rgba(255,250,242,.82); border:1px solid var(--line); border-radius:11px; padding:7px 9px; font-size:10px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:4px;}
  .hudChip b{font-size:13px; color:var(--ink); font-variant-numeric:tabular-nums;}
  button.hudChip{font-family:var(--sans); cursor:pointer; min-height:36px;}
  button.hudChip:active{transform:translateY(1px);}
  #main{flex:1; display:flex; flex-direction:column; gap:10px; animation:fade .22s ease both;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  footer{display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:4px; font-size:10px; color:var(--faint);}
  footer button{background:none; border:none; color:var(--faint); font-size:10px; text-decoration:underline; cursor:pointer; font-family:var(--sans); padding:4px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
  .pad{padding:13px 14px;}
  .eyebrow{font-size:10px; letter-spacing:2px; color:var(--accent); text-transform:uppercase;}
  .muted{color:var(--muted);}
  .small{font-size:11px; line-height:1.6;}
  .serif{font-family:var(--serif);}
  .btn{appearance:none; border:1px solid var(--line2); background:var(--paper2); color:var(--ink); border-radius:13px; min-height:46px; padding:0 16px; font-size:14px; font-family:var(--sans); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:transform .12s, background .2s, opacity .2s;}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--ink); border-color:var(--ink); color:#fbf6ec; letter-spacing:1px;}
  .btn.accent{background:var(--accent); border-color:var(--accent); color:#fff8ef;}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.42; cursor:not-allowed; transform:none;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}

  /* 首页 */
  .intro{position:relative; overflow:hidden; padding:16px 16px 14px; border-style:dashed; border-color:var(--line2);}
  .intro::after{content:""; position:absolute; right:-26px; top:-30px; width:110px; height:110px; border:1px solid var(--line); border-radius:50%; opacity:.55;}
  .intro h2{margin:2px 0 6px; font-family:var(--serif); font-size:20px; letter-spacing:2px; font-weight:700;}
  .intro p{margin:0; font-size:12px; line-height:1.8; color:var(--muted);}
  .intro .rule{height:1px; background:var(--line); margin:11px 0 9px;}
  .intro .quote{font-family:var(--serif); font-size:13px; color:var(--accent2); letter-spacing:.5px;}
  .listTitle{display:flex; justify-content:space-between; align-items:center; padding:2px 2px 0; font-size:11px; color:var(--muted); letter-spacing:1px;}
  .listTitle b{color:var(--ink); font-size:12px;}
  .commissionCard{display:flex; gap:12px; padding:11px; align-items:stretch; position:relative; overflow:hidden;}
  .miniDoll{flex:0 0 84px; border-radius:12px; background:linear-gradient(180deg,#f7efe3,#eee2d1); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
  .miniDoll svg{width:78px; height:132px; display:block;}
  .cBody{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; padding:2px 0;}
  .cTop{display:flex; justify-content:space-between; align-items:baseline; gap:6px;}
  .cTitle{font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:1px;}
  .cNo{font-size:10px; color:var(--faint); letter-spacing:1px;}
  .cMeta{font-size:10px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap;}
  .cQuote{font-family:var(--serif); font-size:12px; color:var(--accent2); line-height:1.55; margin:1px 0 2px;}
  .cFoot{margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .cFoot .btn{min-height:36px; padding:0 13px; font-size:12px; border-radius:10px;}
  .stamp{display:inline-block; transform:rotate(-3deg); border:1.5px solid var(--accent); color:var(--accent); border-radius:7px; padding:3px 6px; font-family:var(--serif); font-size:10px; letter-spacing:1px; opacity:.86; background:rgba(255,250,242,.7);}
  .stamp.gold{border-color:var(--gold); color:var(--gold);}

  /* 委托页 */
  .scene{position:relative; padding:12px; overflow:hidden;}
  .mirror{position:relative; border-radius:13px; background:linear-gradient(180deg,#f8f1e5,#eee1cf); border:1px solid var(--line); min-height:236px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .mirror::before{content:""; position:absolute; inset:8px; border:1px solid rgba(180,160,135,.35); border-radius:9px; pointer-events:none;}
  .mirror::after{content:""; position:absolute; left:0; right:0; bottom:0; height:38%; background:linear-gradient(180deg,rgba(190,160,125,0),rgba(190,160,125,.16)); pointer-events:none;}
  .mirror svg.doll{width:176px; height:300px; display:block; position:relative; z-index:2; filter:drop-shadow(0 8px 10px rgba(90,62,40,.10));}
  .mirror .tag{position:absolute; left:10px; top:10px; z-index:3; font-size:10px; color:var(--muted); background:rgba(255,250,242,.82); border:1px solid var(--line); border-radius:99px; padding:3px 8px;}
  .mirror .tag.right{left:auto; right:10px;}
  .cHead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:2px;}
  .cHead h2{margin:0; font-family:var(--serif); font-size:21px; letter-spacing:1px;}
  .cHead .who{font-size:11px; color:var(--muted); margin-top:3px;}
  .quoteBox{font-family:var(--serif); font-size:14px; line-height:1.65; color:var(--ink); background:#fdf7ed; border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:9px 11px; margin:9px 0 2px;}
  .secLabel{display:flex; justify-content:space-between; align-items:center; font-size:10px; letter-spacing:1.5px; color:var(--muted); margin:13px 1px 6px;}
  .secLabel b{color:var(--ink); font-size:11px; letter-spacing:.5px;}
  .detailGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .detail{appearance:none; font-family:var(--sans); text-align:left; background:var(--paper2); border:1px solid var(--line); border-radius:11px; padding:9px 8px; cursor:pointer; min-height:64px; display:flex; flex-direction:column; gap:5px; color:var(--ink);}
  .detail .di{width:20px; height:20px; border:1px solid var(--line2); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--accent2); font-family:var(--serif);}
  .detail .dn{font-size:11px; line-height:1.4;}
  .detail.read{border-color:var(--accent); background:#fff6ee;}
  .detail.read .di{background:var(--accent); border-color:var(--accent); color:#fff8ef;}
  .detailNote{font-size:11px; line-height:1.65; color:var(--muted); background:#fbf4e8; border:1px dashed var(--line2); border-radius:10px; padding:8px 10px; margin-top:7px; display:none;}
  .detailNote.show{display:block;}
  .qList{display:flex; flex-direction:column; gap:6px;}
  .qOpt{appearance:none; text-align:left; font-family:var(--sans); background:var(--paper2); border:1px solid var(--line); border-radius:11px; padding:10px 11px; font-size:12px; color:var(--ink); cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; min-height:42px;}
  .qOpt:active{transform:translateY(1px);}
  .qOpt .tagPreview{font-size:9px; color:var(--faint); letter-spacing:1px; white-space:nowrap;}
  .qOpt.picked{border-color:var(--accent); background:#fff6ee;}
  .qOpt.picked .tagPreview{color:var(--accent);}
  .qOpt[disabled]{cursor:default; opacity:.55;}
  .qOpt[disabled].picked{opacity:1;}
  .answer{margin-top:7px; font-family:var(--serif); font-size:12px; line-height:1.7; color:var(--accent2); background:#fdf7ed; border:1px dashed var(--line2); border-radius:10px; padding:8px 10px;}
  .answer b{font-family:var(--sans); font-size:9px; letter-spacing:1px; color:var(--accent); border:1px solid var(--accent); border-radius:99px; padding:2px 6px; margin-left:4px; white-space:nowrap;}
  .redline{display:inline-flex; align-items:center; gap:5px; font-size:10px; color:#9c4f45; background:#fbeee9; border:1px solid #ecd3c9; border-radius:99px; padding:3px 8px;}
  .actionBar{position:sticky; bottom:0; padding-top:8px; background:linear-gradient(180deg,rgba(241,233,220,0),var(--paper) 42%);}

  /* 妆台 */
  .studioTop{display:flex; gap:8px; align-items:stretch;}
  .studioTop .mirror{flex:1; min-height:210px;}
  .studioTop .mirror svg.doll{width:150px; height:256px;}
  .lookCol{flex:0 0 106px; display:flex; flex-direction:column; gap:5px;}
  .lookSlot{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 8px; display:flex; justify-content:space-between; align-items:center; gap:5px; font-size:10px; color:var(--muted); box-shadow:0 2px 6px rgba(92,66,44,.05);}
  .lookSlot b{font-size:10px; color:var(--ink); font-weight:500; max-width:62px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lookSlot.on{border-color:#d9b9a5; background:#fff6ee;}
  .tabs{display:flex; gap:5px; overflow-x:auto; padding:2px 1px 4px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto; appearance:none; border:1px solid var(--line); background:var(--paper2); color:var(--muted); border-radius:99px; padding:7px 11px; font-size:11px; font-family:var(--sans); cursor:pointer; min-height:34px;}
  .tab.on{background:var(--ink); border-color:var(--ink); color:#fbf6ec;}
  .tab .dot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent); margin-left:4px; vertical-align:2px;}
  .tab.on .dot{background:#f0c9a8;}
  .optGrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .itemCard{appearance:none; font-family:var(--sans); position:relative; text-align:left; background:var(--paper2); border:1px solid var(--line); border-radius:12px; padding:8px 8px 7px; cursor:pointer; min-height:88px; display:flex; flex-direction:column; gap:4px; color:var(--ink);}
  .itemCard:active{transform:translateY(1px);}
  .itemCard .swatch{width:22px; height:22px; border-radius:50%; border:1px solid rgba(70,55,42,.18); position:relative; overflow:hidden;}
  .itemCard .swatch.pattern{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px);}
  .itemCard .nm{font-size:11px; line-height:1.35; font-weight:500;}
  .itemCard .tg{font-size:9px; color:var(--faint); line-height:1.35;}
  .itemCard.sel{border-color:var(--accent); background:#fff5ec; box-shadow:0 0 0 1px var(--accent) inset;}
  .itemCard.sel::after{content:"已选"; position:absolute; right:6px; top:6px; font-size:8px; letter-spacing:1px; color:#fff8ef; background:var(--accent); border-radius:99px; padding:2px 5px;}
  .itemCard.warn{border-color:#b34f43; background:#fbeee9;}
  .itemCard.warn::before{content:"底线"; position:absolute; right:6px; top:6px; font-size:8px; letter-spacing:1px; color:#fff8ef; background:#b34f43; border-radius:99px; padding:2px 5px;}
  .itemCard.sel.warn::after{display:none;}
  .hintLine{font-size:10px; color:var(--faint); line-height:1.55; text-align:center; padding:2px 0 0;}

  /* 结算 */
  .resultHero{text-align:center; padding:16px 14px 12px; position:relative; overflow:hidden;}
  .resultHero .lv{font-family:var(--serif); font-size:30px; letter-spacing:6px; color:var(--accent); margin:4px 0 4px;}
  .resultHero .lvSub{font-size:11px; color:var(--muted); letter-spacing:1px;}
  .resultHero .rail{position:absolute; left:14px; right:14px; top:12px; height:1px; background:var(--line);}
  .resultDoll{width:150px; height:250px; margin:2px auto 0;}
  .resultDoll svg.doll{width:150px; height:250px; display:block; margin:0 auto;}
  .compare{display:flex; align-items:flex-end; justify-content:center; gap:7px; margin:4px 0 0;}
  .cmp{width:120px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .cmp .cd{width:120px; height:207px;}
  .cmp .cd svg.doll{width:120px; height:207px; display:block;}
  .cmp span{font-size:9px; letter-spacing:2px; color:var(--muted);}
  .cmpArrow{font-size:14px; color:var(--faint); padding-bottom:28px;}
  .blocks{display:flex; flex-direction:column; gap:7px;}
  .blk{display:flex; gap:9px; padding:10px 11px;}
  .blk + .blk{border-top:1px dashed var(--line);}
  .blk .k{flex:0 0 58px; font-size:10px; letter-spacing:1px; color:var(--muted); padding-top:2px;}
  .blk .v{flex:1; font-size:12px; line-height:1.65;}
  .blk .v.serif{font-family:var(--serif); font-size:13px; line-height:1.8;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{font-size:9px; color:var(--muted); border:1px solid var(--line); background:var(--paper2); border-radius:99px; padding:2px 6px;}
  .chip.hit{color:var(--accent2); border-color:#dcc6ae; background:#fdf4e6;}
  .chip.bad{color:#9c4f45; border-color:#e4c3b7; background:#fbeee9;}
  .story{font-family:var(--serif); font-size:14px; line-height:1.95; letter-spacing:.3px; padding:13px 14px; background:#fdf7ed; border:1px solid var(--line); border-radius:14px;}
  .story .cap{font-family:var(--sans); font-size:9px; letter-spacing:2px; color:var(--accent); display:block; margin-bottom:6px;}
  .scoreDetail{border:1px dashed var(--line2); border-radius:10px; padding:8px 10px; font-size:10px; color:var(--muted); line-height:1.7; background:#fbf4e8;}
  .scoreDetail summary{cursor:pointer; color:var(--accent2);}
  .rewardRow{display:flex; gap:6px;}
  .rewardRow .r{flex:1; text-align:center; background:var(--paper2); border:1px solid var(--line); border-radius:11px; padding:8px 4px; font-size:10px; color:var(--muted);}
  .rewardRow .r b{display:block; font-family:var(--serif); font-size:17px; color:var(--ink); margin-bottom:2px;}

  /* 客人簿 */
  .bookRow{display:flex; gap:10px; padding:10px; align-items:stretch;}
  .bookRow .miniDoll{flex:0 0 62px;}
  .bookRow .miniDoll svg{width:58px; height:100px;}
  .bookRow .bBody{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .bookRow .bTop{display:flex; justify-content:space-between; gap:6px; align-items:baseline;}
  .bookRow .bTitle{font-family:var(--serif); font-size:14px;}
  .bookRow .bLv{font-size:9px; color:var(--accent); border:1px solid currentColor; border-radius:99px; padding:2px 6px; letter-spacing:1px;}
  .bookRow .bStory{font-size:10px; line-height:1.6; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .emptyBook{text-align:center; padding:26px 16px; color:var(--muted); font-size:12px; line-height:1.8;}

  /* 通用 */
  #toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,14px); background:rgba(60,51,44,.94); color:#fbf6ec; font-size:12px; padding:9px 14px; border-radius:99px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:80; max-width:88vw; text-align:center;}
  #toast.on{opacity:1; transform:translate(-50%,0);}
  .modal{position:fixed; inset:0; background:rgba(55,44,34,.42); display:flex; align-items:flex-end; justify-content:center; z-index:90; padding:12px;}
  .modal.hidden{display:none;}
  .sheet{width:100%; max-width:430px; max-height:80dvh; overflow:auto; background:var(--paper2); border-radius:18px; border:1px solid var(--line); padding:14px; box-shadow:0 -8px 40px rgba(60,40,25,.2);}
  .sheet h3{margin:0 0 8px; font-family:var(--serif); font-size:16px; letter-spacing:1px;}
  .evRow{display:flex; justify-content:space-between; gap:8px; font-size:10px; color:var(--muted); border-bottom:1px dotted var(--line); padding:5px 0;}
  .evRow b{color:var(--ink); font-weight:500;}
  .hidden{display:none !important;}
  .spacer{height:2px;}
  @media (max-width:360px){
    .optGrid{gap:5px;} .itemCard{padding:7px 6px;} .itemCard .nm{font-size:10px;}
    .lookCol{flex-basis:96px;} .mirror svg.doll{width:160px; height:276px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandRow">
      <div class="brand">妆匣<span>一日妆造师 · 灰盒</span></div>
      <div class="ver" id="verLabel">vB0.3</div>
    </div>
    <div class="hud">
      <div class="hudChip"><span>印章</span><b id="sealCount">0</b></div>
      <div class="hudChip"><span>已归档</span><b id="doneCount">0 / 12</b></div>
      <button class="hudChip" id="bookBtn">客人簿</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    <span>灰盒 vB0.1 · AI 起草，待人类拍板</span>
    <button id="logBtn">记录</button>
  </footer>
</div>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script type="application/json" id="gameData">
{
  "version": "vB0.3",
  "desires": {
    "seen": "被看见",
    "respect": "被尊重",
    "ease": "松弛",
    "safe": "安全感",
    "memory": "纪念",
    "restart": "重新开始"
  },
  "occasions": {
    "solemn": "郑重",
    "daily": "日常",
    "celebrate": "庆祝",
    "farewell": "告别"
  },
  "items": {
    "b1": {"slot":"base","name":"雾面底妆","tags":["respect","safe"],"occasions":["solemn"],"attrs":["哑光","自然"],"color":"#efd8c6"},
    "b2": {"slot":"base","name":"水光底妆","tags":["seen","ease"],"occasions":["celebrate"],"attrs":["水光","自然"],"color":"#f5dfce"},
    "b3": {"slot":"base","name":"轻透素肌","tags":["ease","memory"],"occasions":["daily","solemn"],"attrs":["自然","轻薄"],"color":"#f2dccb"},
    "b4": {"slot":"base","name":"柔焦遮瑕","tags":["safe","respect"],"occasions":["solemn"],"attrs":["遮瑕","哑光"],"color":"#ecd4c2"},
    "b5": {"slot":"base","name":"丝绒底妆","tags":["memory","restart"],"occasions":["celebrate","farewell"],"attrs":["哑光","丝绒"],"color":"#ead3c0"},
    "b6": {"slot":"base","name":"暖调素颜霜","tags":["ease","safe"],"occasions":["daily"],"attrs":["自然","水光"],"color":"#f4e0cf"},

    "e1": {"slot":"eye","name":"大地眼影","tags":["respect","ease"],"occasions":["daily","solemn"],"attrs":["棕","哑光"],"color":"#a8876f"},
    "e2": {"slot":"eye","name":"细闪眼影","tags":["seen","restart"],"occasions":["celebrate"],"attrs":["亮片","香槟"],"color":"#c9a96e"},
    "e3": {"slot":"eye","name":"素眼","tags":["safe","memory"],"occasions":["daily"],"attrs":["素","无"],"color":null},

function chapterOf(c){ return c.chapter || 1; }
function chapterOpen(no){
  if(QA) return true;

  return !meta || S.seals >= meta.seals;
}
const SLOTS = ['base','eye','lip','hair','top','bottom','accessory'];

    if(!raw) return freshState();
    const st = JSON.parse(raw);
    if(!st || st.version !== VERSION) return freshState();
    st.events = Array.isArray(st.events) ? st.events.slice(-300) : [];
    st.done = st.done && typeof st.done === 'object' ? st.done : {};
    st.seals = Number(st.seals) || 0;
    return st;
  }catch(e){ return freshState(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
}
function log(type, data){
  S.events.push(Object.assign({t:Date.now(), type:type}, data||{}));
  if(S.events.length > 300) S.events = S.events.slice(-300);
}
function cById(id){ return DATA.commissions.find(function(c){ return c.id === id; }) || null; }
function itemById(id){ const it = DATA.items[id]; return it ? Object.assign({id:id}, it) : null; }
function tagName(tag){ return DATA.desires[tag] || tag; }
function occName(tag){ return DATA.occasions[tag] || tag; }

function lookOf(c, picks){
  const look = {};
  SLOTS.forEach(function(slot){
    const id = picks && picks[slot];
    look[slot] = id ? itemById(id) : null;
  });
  if(!look.hair && c) look.hair = itemById(c.defaultHair) || itemById('h2');
  return look;
}

function evaluate(c, picks){
  const picked = SLOTS.map(function(s){ return picks[s]; }).filter(Boolean).map(itemById);
  const bad = picked.filter(function(it){ return it.attrs.indexOf(c.redline.attr) >= 0; });
  const good = picked.filter(function(it){ return it.attrs.indexOf(c.redline.attr) < 0; });
  const mainHits = good.filter(function(it){ return it.tags.indexOf(c.main) >= 0; }).length;
  const secHits = good.filter(function(it){ return it.tags.indexOf(c.secondary) >= 0; }).length;
  const occHits = good.filter(function(it){ return it.occasions.indexOf(c.occasion) >= 0; }).length;
  let score = 2 + (mainHits >= 4 ? 3 : 0) + (secHits >= 3 ? 2 : 0) + (occHits >= 2 ? 1 : 0) - bad.length * 3;
  const level = score >= 7 ? 'qihe' : score >= 5 ? 'heshi' : score >= 3 ? 'jiangjiu' : 'cuowei';
  return {score:score, level:level, mainHits:mainHits, secHits:secHits, occHits:occHits, bad:bad.length,
          main:c.main, secondary:c.secondary, complete:picked.length === SLOTS.length};
}

function auditCommission(c){
  const list = SLOTS.slice();
  const dist = {qihe:0, heshi:0, jiangjiu:0, cuowei:0};
  let total = 0, qihe = 0, maxScore = -99, sample = null;
  const walk = function(idx, picks){
    if(idx === list.length){
      const ev = evaluate(c, picks);
      total++; dist[ev.level]++;
      if(ev.level === 'qihe') qihe++;
      if(ev.score > maxScore){ maxScore = ev.score; sample = Object.assign({}, picks); }
      return;
    }
    const slot = list[idx];
    c.candidates[slot].forEach(function(id){
      picks[slot] = id;
      walk(idx + 1, picks);
    });
  };
  walk(0, {});
  return {id:c.id, total:total, qihe:qihe, dist:dist, maxScore:maxScore, sample:sample};
}
window.__EVER = VERSION;
window.__audit = function(){ return DATA.commissions.map(auditCommission); };

}

}

function swatchStyle(it){
  if(!it || !it.color) return '';
  return 'background:' + it.color + ';';
}
function swatchClass(it){
  if(!it) return '';
  if(!it.color) return 'pattern';
  return '';
}
function render(){
  document.getElementById('sealCount').textContent = S.seals;
  document.getElementById('doneCount').textContent = doneCount() + ' / ' + DATA.commissions.length;
  document.getElementById('verLabel').textContent = VERSION;
  const main = document.getElementById('main');
  let html = '';
  if(S.view === 'commission') html = commissionView();
  else if(S.view === 'studio') html = studioView();
  else if(S.view === 'result') html = resultView();
  else if(S.view === 'book') html = bookView();
  else html = homeView();
  main.innerHTML = html;
}
function go(view, scroll){
  S.view = view;
  save();
  render();
  if(scroll !== false) window.scrollTo(0, 0);
}
function miniDoll(c, picks){
  return '<div class="miniDoll">' + dollSVG(lookOf(c, picks), {cid: c.id, state: 'partial'}) + '</div>';
}
function orderCard(c){
  const rec = S.done[c.id];
  const look = lookOf(c, rec ? rec.picks : (S.cur && S.cur.cid === c.id ? S.cur.picks : {}));
  const inProgress = S.cur && S.cur.cid === c.id && !rec &&
    (S.cur.read.length > 0 || S.cur.asked !== null || Object.keys(S.cur.picks).length > 0);
  const label = rec ? '重看结局' : (inProgress ? '继续' : '接单');
  const act = rec ? 'replay' : 'open';
  const stamp = rec ? '<span class="stamp ' + (rec.level === 'qihe' ? 'gold' : '') + '">已归档 · ' + LEVELS[rec.level].name + '</span>' : '';
  const quote = rec ? (c.stories[rec.level] || c.quote) : c.quote;
  return '<section class="card commissionCard">' + miniDoll(c, look) +
    '<div class="cBody">' +
      '<div class="cTop"><div class="cTitle">' + esc(c.title) + '</div><div class="cNo">第 ' + c.no + ' 单</div></div>' +
      '<div class="cMeta"><span>' + esc(c.client) + '</span><span>' + esc(c.who) + '</span><span>' + occName(c.occasion) + '</span></div>' +
      (rec ? '<div>' + stamp + '</div>' : '') +
      '<div class="cQuote">「' + esc(quote) + '」</div>' +
      '<div class="cMeta"><span class="redline">底线 · ' + esc(c.redline.text) + '</span></div>' +
      '<div class="cFoot"><span class="small muted">' + (rec ? '印章 +' + rec.earned : '三处细节 · 一次追问') + '</span>' +
      '<button class="btn ' + (rec ? 'ghost' : 'accent') + '" data-act="' + act + '" data-cid="' + c.id + '">' + label + '</button></div>' +
    '</div></section>';
}
function lockedCard(c, need){
  return '<section class="card commissionCard" style="opacity:.5">' + miniDoll(c, {}) +
    '<div class="cBody">' +
      '<div class="cTop"><div class="cTitle">' + esc(c.title) + '</div><div class="cNo">第 ' + c.no + ' 单</div></div>' +
      '<div class="cMeta"><span>' + esc(c.client) + '</span><span>' + esc(c.who) + '</span><span>' + occName(c.occasion) + '</span></div>' +
      '<div class="cQuote">「' + esc(c.quote) + '」</div>' +
      '<div class="cFoot"><span class="small muted">再得 ' + need + ' 枚印章解锁</span>' +
      '<button class="btn ghost" disabled>未解锁</button></div>' +
    '</div></section>';
}
function homeView(){
  const intro = '<section class="card intro">' +
    '<div class="eyebrow">M2 垂直切片 · 12 单 · 三章</div>' +
    '<h2>今天，她想成为谁</h2>' +
    '<p>看她的细节，问一句话，替她决定妆容与衣橱。没有倒计时，也不会因为你选错就结束；她只会带着你的选择，走出这扇门。</p>' +
    '<div class="rule"></div>' +
    '<div class="quote">「妆不是用来修正谁的，是用来送她去她想去的地方。」</div>' +
    '</section>';
  const groups = CHAPTERS.map(function(ch){
    const list = DATA.commissions.filter(function(c){ return chapterOf(c) === ch.no; });
    const open = chapterOpen(ch.no);
    const done = list.filter(function(c){ return S.done[c.id]; }).length;
    const head = '<div class="listTitle"><b>第 ' + ch.no + ' 章 · ' + esc(ch.name) + '</b><span>' +
      (open ? done + ' / ' + list.length + ' 单 · ' + esc(ch.sub) : '需要 ' + ch.seals + ' 枚印章（当前 ' + S.seals + '）') +
      '</span></div>';
    const body = list.map(function(c){
      return open ? orderCard(c) : lockedCard(c, Math.max(0, ch.seals - S.seals));
    }).join('');
    return head + '<div style="display:flex;flex-direction:column;gap:9px">' + body + '</div>';
  }).join('');
  return intro + groups +
    '<div class="card pad small muted" style="line-height:1.8">M2 说明：12 单按印章解锁（第 2 章 4 枚、第 3 章 10 枚），每单都有至少两种「契合」解法；选品不随机、不抽卡。所有选择都会记入埋点，可在页脚「记录」查看。' +
    (QA ? '　当前为 QA 模式：全部章节已解锁。' : '') + '</div>';
}

function commissionView(){
  const c = cById(S.cur && S.cur.cid);
  if(!c){ S.view = 'home'; return homeView(); }
  const cur = ensureCur(c.id);
  const look = lookOf(c, cur.picks);
  const detailNote = cur.lastDetail >= 0 && c.details[cur.lastDetail]
    ? '<div class="detailNote show">' + esc(c.details[cur.lastDetail].text) + '</div>'
    : '<div class="detailNote">点开三个细节，再决定问什么。细节不会直接给答案，只会告诉你她在意什么。</div>';
  const details = c.details.map(function(d, i){
    const read = cur.read.indexOf(i) >= 0;
    return '<button class="detail ' + (read ? 'read' : '') + '" data-act="detail" data-i="' + i + '">' +
      '<span class="di">' + (read ? '✓' : '·') + '</span><span class="dn">' + esc(d.name) + '</span></button>';
  }).join('');
  const qs = c.questions.map(function(q, i){
    const picked = cur.asked === i;
    const disabled = cur.asked !== null && !picked;
    return '<button class="qOpt ' + (picked ? 'picked' : '') + '" data-act="ask" data-i="' + i + '"' +
      (disabled ? ' disabled' : '') + '>' +
      '<span>' + esc(q.q) + '</span><span class="tagPreview">' + (picked ? tagName(q.tag) : '问一句') + '</span></button>';
  }).join('');
  const answer = cur.asked !== null && c.questions[cur.asked]
    ? '<div class="answer">' + esc(c.questions[cur.asked].answer) + '<b>' + tagName(c.questions[cur.asked].tag) + '</b></div>'
    : '';
  return '<div class="row" style="gap:6px"><button class="btn ghost" style="flex:0 0 auto;min-height:36px;padding:0 12px;font-size:12px" data-act="home">返回</button>' +
    '<div class="small muted" style="display:flex;align-items:center;justify-content:flex-end">已读细节 ' + cur.read.length + ' / 3</div></div>' +
    '<section class="card scene">' +
      '<div class="mirror"><span class="tag">妆前 · 线稿</span><span class="tag right">' + occName(c.occasion) + '</span>' + dollSVG(look, {cid: c.id, state: 'line'}) + '</div>' +
      '<div class="cHead" style="margin-top:10px"><div><h2>' + esc(c.title) + '</h2><div class="who">' + esc(c.client) + ' · ' + esc(c.who) + '</div></div>' +
        '<span class="redline">' + esc(c.redline.text) + '</span></div>' +
      '<div class="quoteBox">「' + esc(c.quote) + '」</div>' +
    '</section>' +
    '<section class="card pad">' +
      '<div class="secLabel"><b>她带着什么</b><span>点开看看</span></div>' +
      '<div class="detailGrid">' + details + '</div>' + detailNote +
    '</section>' +
    '<section class="card pad">' +
      '<div class="secLabel"><b>问一句</b><span>' + (cur.asked === null ? '只能问一次' : '已经问过了') + '</span></div>' +
      '<div class="qList">' + qs + '</div>' + answer +
    '</section>' +
    '<div class="actionBar"><button class="btn primary block" data-act="start">开始妆造</button>' +
      '<div class="hintLine">不问也可以开始，但你会少一条线索。</div></div>';
}

function selectedText(cur, slot){
  const it = cur.picks[slot] ? itemById(cur.picks[slot]) : null;
  return it ? it.name : '未选';
}

function studioView(){
  const c = cById(S.cur && S.cur.cid);
  if(!c){ S.view = 'home'; return homeView(); }
  const cur = ensureCur(c.id);
  const active = cur.slot && SLOTS.indexOf(cur.slot) >= 0 ? cur.slot : 'base';
  cur.slot = active;
  const look = lookOf(c, cur.picks);
  const count = Object.keys(cur.picks).length;
  const lookCol = SLOTS.map(function(slot){
    return '<button class="lookSlot ' + (slot === active ? 'on' : '') + '" data-act="tab" data-slot="' + slot + '">' +
      '<span>' + SLOT_LABEL[slot] + '</span><b>' + esc(selectedText(cur, slot)) + '</b></button>';
  }).join('');
  const tabs = SLOTS.map(function(slot){
    return '<button class="tab ' + (slot === active ? 'on' : '') + '" data-act="tab" data-slot="' + slot + '">' +
      SLOT_LABEL[slot] + (cur.picks[slot] ? '<i class="dot"></i>' : '') + '</button>';
  }).join('');
  const cards = c.candidates[active].map(function(id){
    const it = itemById(id);
    const sel = cur.picks[active] === id;
    const bad = it.attrs.indexOf(c.redline.attr) >= 0;
    const cls = 'itemCard ' + (sel ? 'sel ' : '') + (sel && bad ? 'warn' : '');
    return '<button class="' + cls + '" data-act="pick" data-id="' + id + '">' +
      '<span class="swatch ' + swatchClass(it) + '" style="' + swatchStyle(it) + '"></span>' +
      '<span class="nm">' + esc(it.name) + '</span>' +
      '<span class="tg">' + it.tags.map(tagName).join(' / ') + '</span>' +
    '</button>';
  }).join('');
  const canGo = count === SLOTS.length;
  return '<div class="row" style="gap:6px"><button class="btn ghost" style="flex:0 0 auto;min-height:36px;padding:0 12px;font-size:12px" data-act="back-commission">看委托</button>' +
    '<div class="small muted" style="display:flex;align-items:center;justify-content:flex-end">已选 ' + count + ' / 7</div></div>' +
    '<section class="card scene" style="padding:9px">' +
      '<div class="studioTop">' +
        '<div class="mirror"><span class="tag">妆造中</span><span class="tag right">' + occName(c.occasion) + '</span>' + dollSVG(look, {cid: c.id, state: 'partial'}) + '</div>' +
        '<div class="lookCol">' + lookCol + '</div>' +
      '</div>' +
    '</section>' +
    '<div class="tabs">' + tabs + '</div>' +
    '<section class="card pad" style="padding:10px">' +
      '<div class="secLabel" style="margin-top:0"><b>' + SLOT_LABEL[active] + '</b><span>每件都带一个诉求</span></div>' +
      '<div class="optGrid">' + cards + '</div>' +
      '<div class="hintLine">选错不会被拦住，只会在出门时被记住。</div>' +
    '</section>' +
    '<div class="actionBar row"><button class="btn ghost" data-act="back-commission">再看一眼委托</button>' +
      '<button class="btn primary" data-act="goout"' + (canGo ? '' : ' disabled') + '>出门</button></div>';
}
function resultView(){
  const c = cById(S.cur && S.cur.cid);
  if(!c){ S.view = 'home'; return homeView(); }
  const rec = S.done[c.id];
  if(!rec){ S.view = 'home'; return homeView(); }
  const lv = LEVELS[rec.level];
  const picks = rec.picks;
  const look = lookOf(c, picks);
  const picked = SLOTS.map(function(s){ return itemById(picks[s]); }).filter(Boolean);
  const badItems = picked.filter(function(it){ return it.attrs.indexOf(c.redline.attr) >= 0; });
  const chips = picked.map(function(it){
    const bad = it.attrs.indexOf(c.redline.attr) >= 0;
    return '<span class="chip ' + (bad ? 'bad' : 'hit') + '">' + esc(it.name) + '</span>';
  }).join('');
  const story = c.stories[rec.level] || '';
  const earned = S.cur && typeof S.cur.lastEarned === 'number' ? S.cur.lastEarned : 0;
  const next = nextCommission();
  return '<section class="card resultHero">' +
      '<div class="rail"></div>' +
      '<div class="eyebrow">第 ' + c.no + ' 单 · 已归档</div>' +
      '<div class="lv">' + lv.name + '</div>' +
      '<div class="lvSub">' + lv.sub + '</div>' +
      '<div class="compare">' +
        '<div class="cmp"><div class="cd">' + dollSVG(lookOf(c, {}), {cid: c.id, state: 'line'}) + '</div><span>妆前</span></div>' +
        '<div class="cmpArrow">→</div>' +
        '<div class="cmp"><div class="cd">' + dollSVG(look, {cid: c.id, state: 'full'}) + '</div><span>出门</span></div>' +
      '</div>' +
    '</section>' +
    '<section class="card blocks">' +
      '<div class="blk"><div class="k">她说的</div><div class="v serif">「' + esc(c.quote) + '」</div></div>' +
      '<div class="blk"><div class="k">她在意的</div><div class="v">' + tagName(c.main) + '（主）· ' + tagName(c.secondary) + '（次）' +
        '<div class="small muted" style="margin-top:3px">底线：' + esc(c.redline.text) + (badItems.length ? ' · 你触线 ' + badItems.length + ' 件' : ' · 没有触线') + '</div></div></div>' +
      '<div class="blk"><div class="k">你给她的</div><div class="v"><div class="chips">' + chips + '</div></div></div>' +
    '</section>' +
    '<div class="story"><span class="cap">她的一天</span>' + esc(story) + '</div>' +
    '<details class="scoreDetail"><summary>灰盒评分明细</summary>' +
      '完成 +2 ｜ 主诉求命中 ' + rec.mainHits + ' 件（≥4 得 +3）｜ 次诉求命中 ' + rec.secHits + ' 件（≥3 得 +2）｜ 场合命中 ' + rec.occHits + ' 件（≥2 得 +1）｜ 底线 ' + rec.bad + ' 件（每件 -3，且不计正向标签）｜ 合计 ' + rec.score +
    '</details>' +
    '<div class="rewardRow">' +
      '<div class="r"><b>+' + earned + '</b>印章</div>' +
      '<div class="r"><b>1</b>客人簿页</div>' +
      '<div class="r"><b>—</b>衣橱灰盒未开</div>' +
    '</div>' +
    '<div class="row"><button class="btn primary" data-act="' + (next ? 'open' : 'home') + '"' + (next ? ' data-cid="' + next.id + '"' : '') + '>' + (next ? '下一单 · ' + esc(next.title) : '回到首页') + '</button>' +
      '<button class="btn ghost" data-act="retry">再整一次</button></div>' +
    '<div class="row"><button class="btn ghost" data-act="book">客人簿</button><button class="btn ghost" data-act="home">返回首页</button></div>' +
    '<div class="hintLine">重复游玩不会重复计印章；已解锁的结局与客人簿不会丢失。</div>';
}

function bookView(){
  const rows = DATA.commissions.map(function(c){
    const rec = S.done[c.id];
    if(rec){
      return '<section class="card bookRow">' + miniDoll(c, rec.picks) +
        '<div class="bBody"><div class="bTop"><div class="bTitle">' + esc(c.title) + '</div><span class="bLv">' + LEVELS[rec.level].name + '</span></div>' +
          '<div class="cMeta"><span>' + esc(c.client) + '</span><span>' + occName(c.occasion) + '</span></div>' +
          '<div class="bStory">' + esc(c.stories[rec.level]) + '</div>' +
          '<div style="margin-top:auto"><button class="btn ghost" style="min-height:32px;font-size:11px;padding:0 10px" data-act="replay" data-cid="' + c.id + '">重看这一页</button></div>' +
        '</div></section>';
    }
    return '<section class="card bookRow">' + miniDoll(c, {}) +
      '<div class="bBody"><div class="bTop"><div class="bTitle">' + esc(c.title) + '</div><span class="bLv" style="color:var(--faint)">' + (chapterOpen(chapterOf(c)) ? '未归档' : '未解锁') + '</span></div>' +
        '<div class="cMeta"><span>' + esc(c.client) + '</span><span>' + esc(c.who) + '</span></div>' +
        '<div class="bStory">' + (chapterOpen(chapterOf(c)) ? '她还在等一个愿意读懂她的人。' : '这一页还锁着，要等更多印章。') + '</div>' +
        '<div style="margin-top:auto"><button class="btn ghost" style="min-height:32px;font-size:11px;padding:0 10px" data-act="open" data-cid="' + c.id + '"' +
          (chapterOpen(chapterOf(c)) ? '' : ' disabled') + '>' + (chapterOpen(chapterOf(c)) ? '去接单' : '未解锁') + '</button></div>' +
      '</div></section>';
  }).join('');
  return '<div class="row" style="gap:6px"><button class="btn ghost" style="flex:0 0 auto;min-height:36px;padding:0 12px;font-size:12px" data-act="home">返回</button>' +
    '<div class="small muted" style="display:flex;align-items:center;justify-content:flex-end">' + doneCount() + ' / ' + DATA.commissions.length + ' 页 · 印章 ' + S.seals + '</div></div>' +
    '<div class="card pad" style="padding:13px 14px"><div class="eyebrow">客人簿</div>' +
      '<div class="serif" style="font-size:19px;letter-spacing:2px;margin-top:3px">她来过，然后出门了</div>' +
      '<div class="small muted" style="margin-top:5px;line-height:1.7">每一页记下她说的、她真正在意的，以及你给她的那套衣服。全书 12 页，分属三章。</div></div>' +
    rows +
    '<div class="row" style="margin-top:2px"><button class="btn ghost" data-act="home">回到首页</button>' +
      '<button class="btn ghost" data-act="reset" style="color:#9c4f45">清空本机存档</button></div>';
}

function openCommission(cid){
  const c = cById(cid);
  if(!c) return;
  if(!chapterOpen(chapterOf(c))){
    toast('还差 ' + Math.max(0, CHAPTERS[chapterOf(c) - 1].seals - S.seals) + ' 枚印章才能接这一单。');
    return;
  }
  if(S.done[cid] || !S.cur || S.cur.cid !== cid){
    S.cur = {cid:cid, read:[], asked:null, picks:{}, lastDetail:-1, slot:'base'};
  }
  ensureCur(cid);
  log('commission_start', {cid:cid});
  go('commission');
}

function startStudio(){
  const c = cById(S.cur && S.cur.cid);
  if(!c) return;
  const cur = ensureCur(c.id);
  cur.slot = cur.slot || 'base';
  log('studio_open', {cid:c.id});
  go('studio');
}

function finishLook(){
  const c = cById(S.cur && S.cur.cid);
  if(!c) return;
  const cur = ensureCur(c.id);
  const count = Object.keys(cur.picks).length;
  if(count < SLOTS.length){ toast('还差 ' + (SLOTS.length - count) + ' 件，妆造还没完成。'); return; }
  const ev = evaluate(c, cur.picks);
  const prev = S.done[c.id];
  let earned = 0;
  if(!prev){
    earned = 1 + (ev.level === 'qihe' ? 2 : ev.level === 'heshi' ? 1 : 0);
    S.seals += earned;
    S.done[c.id] = {level:ev.level, score:ev.score, mainHits:ev.mainHits, secHits:ev.secHits,
      occHits:ev.occHits, bad:ev.bad, picks:Object.assign({}, cur.picks), earned:earned, ts:Date.now()};
  }else{
    S.done[c.id] = Object.assign({}, prev, {level:ev.level, score:ev.score, mainHits:ev.mainHits,
      secHits:ev.secHits, occHits:ev.occHits, bad:ev.bad, picks:Object.assign({}, cur.picks), ts:Date.now()});
  }
  cur.lastEarned = earned;
  log('goout', {cid:c.id});
  log('result', {cid:c.id, level:ev.level, score:ev.score, first:!prev});
  go('result');
}

function replayCommission(cid){
  const rec = S.done[cid];
  const c = cById(cid);
  if(!rec || !c){ openCommission(cid); return; }
  S.cur = {cid:cid, read:[], asked:null, picks:Object.assign({}, rec.picks), lastDetail:-1, slot:'base', lastEarned:0};
  log('result_replay', {cid:cid});
  go('result');
}

function retryCommission(){
  const c = cById(S.cur && S.cur.cid);
  if(!c) return;
  const cur = ensureCur(c.id);
  cur.picks = {};
  cur.lastEarned = 0;
  cur.slot = 'base';
  log('retry', {cid:c.id});
  go('studio');
}

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2100);
}

function openLog(){
  const counts = {};
  S.events.forEach(function(e){ counts[e.type] = (counts[e.type] || 0) + 1; });
  const countRows = Object.keys(counts).sort().map(function(k){
    return '<div class="evRow"><b>' + esc(k) + '</b><span>' + counts[k] + '</span></div>';
  }).join('') || '<div class="small muted">还没有记录。</div>';
  const rows = S.events.slice(-20).reverse().map(function(e){
    const d = new Date(e.t);
    const tm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
    const extra = Object.assign({}, e); delete extra.t; delete extra.type;
    return '<div class="evRow"><span>' + tm + ' · ' + esc(e.type) + '</span><b>' + esc(JSON.stringify(extra)) + '</b></div>';
  }).join('');
  document.getElementById('sheet').innerHTML =
    '<h3>埋点记录</h3>' +
    '<div class="small muted" style="margin-bottom:6px">本地 localStorage · 最近 ' + S.events.length + ' 条（最多 300 条）</div>' +
    countRows +
    '<h3 style="margin-top:14px">最近事件</h3>' + rows +
    '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="copy">复制 JSON</button>' +
      '<button class="btn ghost" data-act="close-modal">关闭</button></div>';
  document.getElementById('modal').classList.remove('hidden');
}

function copyEvents(){
  const text = JSON.stringify(S.events, null, 2);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('埋点已复制'); }, function(){ toast('复制失败，请手动截图'); });
  }else{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('埋点已复制'); }catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
}

document.getElementById('bookBtn').addEventListener('click', function(){
  log('guestbook_open', {});
  save();
  go('book');
});
document.getElementById('logBtn').addEventListener('click', openLog);

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const act = el.getAttribute('data-act');
  const cid = el.getAttribute('data-cid');
  const cur = S.cur;
  if(act === 'open'){ openCommission(cid); return; }
  if(act === 'replay'){ replayCommission(cid); return; }
  if(act === 'home'){ go('home'); return; }
  if(act === 'book'){ log('guestbook_open', {}); save(); go('book'); return; }
  if(act === 'back-commission'){ go('commission'); return; }
  if(act === 'start'){ startStudio(); return; }
  if(act === 'retry'){ retryCommission(); return; }
  if(act === 'goout'){ finishLook(); return; }
  if(act === 'close-modal'){ document.getElementById('modal').classList.add('hidden'); return; }
  if(act === 'copy'){ copyEvents(); return; }
  if(act === 'reset'){
    if(window.confirm('清空本机存档？12 单归档与印章都会消失，埋点也会清空。')){
      try{ localStorage.removeItem(STORE_KEY); }catch(err){}
      S = freshState();
      log('session_start', {version:VERSION, reset:true});
      save();
      go('home');
      toast('本机存档已清空');
    }
    return;
  }
  if(!cur) return;
  if(act === 'detail'){
    const i = Number(el.getAttribute('data-i'));
    if(cur.read.indexOf(i) < 0) cur.read.push(i);
    cur.lastDetail = i;
    log('detail_tap', {cid:cur.cid, index:i});
    save(); render(); return;
  }
  if(act === 'ask'){
    if(cur.asked !== null) return;
    const i = Number(el.getAttribute('data-i'));
    cur.asked = i;
    const q = cById(cur.cid).questions[i];
    log('ask_choose', {cid:cur.cid, index:i, tag:q.tag});
    save(); render(); return;
  }
  if(act === 'tab'){
    cur.slot = el.getAttribute('data-slot');
    save(); render(); return;
  }
  if(act === 'pick'){
    const c = cById(cur.cid);
    const id = el.getAttribute('data-id');
    const it = itemById(id);
    const slot = cur.slot;
    if(cur.picks[slot] === id){
      delete cur.picks[slot];
    }else{
      cur.picks[slot] = id;
      if(it.attrs.indexOf(c.redline.attr) >= 0){
        log('redline_warn', {cid:c.id, slot:slot, id:id});
        toast('她说过「' + c.redline.text + '」。');
      }
    }
    const isMakeup = ['base','eye','lip','hair'].indexOf(slot) >= 0;
    log(isMakeup ? 'makeup_pick' : 'outfit_pick', {cid:c.id, slot:slot, id:id, on:cur.picks[slot] === id});
    save(); render(); return;
  }
});

document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) this.classList.add('hidden');
});

log('session_start', {version:VERSION});
save();
render();
</script>
</body>
